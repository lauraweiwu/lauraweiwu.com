remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Laura Weiwu
  email: lauraww@berkeley.edu
  
title: Laura Weiwu
description: |
  <b>Assistant Professor</b><br>
  Haas School of Business<br>
  UC Berkeley<br>
  2220 Piedmont Ave<br>
  Berkeley, CA 94720<br>
  <br><b>[[lauraww@berkeley.edu||mailto:lauraww@berkeley.edu]]</b>

url: https://lauraweiwu.com
baseurl: ""  # empty when using a custom domain

navigation:
  - title: Research
    url: /
    hash: working-papers
    nav: research
  - title: Data
    url: /data/
    nav: data
  - title: Teaching
    url: /teaching/
    nav: teaching
  - title: CV
    url: /assets/files/Laura_Weiwu_CV.pdf
    nav: cv
    new_tab: true

# Minimal theme extras
show_downloads: false

# Set sensible defaults
defaults:
  - scope:
      path: ""   # all files
    values:
      layout: default

logo: /assets/images/laura-weiwu-crop.jpeg
include:
  - assets
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
